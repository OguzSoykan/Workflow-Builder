name: Deploy
# Manual, gated deploy (WB-023, AC-13). Nothing runs until the owner creates the Cloudflare
# resources, replaces the placeholder D1 IDs and adds CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# as environment secrets. Configure required reviewers on the "production" GitHub environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      TARGET: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci
      - name: Refuse placeholder resources
        run: npm run deploy:check -- "$TARGET"
      # The same gates as the quality workflow; a failing gate stops the deploy.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit, security and docs tests
        run: npm test
      - name: Build (web + all Worker environments, dry-run)
        run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --config infra/wrangler.jsonc --env "$TARGET" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --config infra/wrangler.jsonc --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: npm run smoke -- "${{ vars.APP_URL }}"
